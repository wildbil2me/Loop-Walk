<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trailhead — Loop Walk Generator</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,500;0,6..72,600;1,6..72,500&family=Public+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDE6D6;
    --paper-dark: #E2D9C4;
    --ink: #2E3B2F;
    --ink-soft: #55614F;
    --blaze: #C1521F;
    --blaze-dark: #9B3F16;
    --pine: #3E6B63;
    --brass: #A98B4E;
    --line: rgba(46,59,47,0.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-radial-gradient(circle at 20% 15%, transparent 0, transparent 38px, var(--line) 39px, transparent 40px),
      repeating-radial-gradient(circle at 85% 80%, transparent 0, transparent 52px, var(--line) 53px, transparent 54px),
      var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    min-height:100vh;
    padding: 20px 16px 60px;
  }
  .wrap{ max-width: 480px; margin: 0 auto; }

  header{ margin-bottom: 22px; }
  .eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--brass);
    font-weight: 700;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:16px; height:1px; background:var(--brass);
    display:inline-block;
  }
  h1{
    font-family:'Newsreader', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 34px;
    line-height: 1.05;
    margin: 6px 0 4px;
    color: var(--ink);
  }
  .sub{
    font-size: 13.5px;
    color: var(--ink-soft);
    line-height:1.5;
    max-width: 40ch;
  }

  .card{
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 18px;
    margin-bottom: 16px;
    position: relative;
  }
  .card::before{
    content:"";
    position:absolute; top:8px; left:8px; right:8px; bottom:8px;
    border: 1px dashed var(--line);
    pointer-events:none;
    border-radius: 2px;
  }

  .mode-toggle{
    display:flex; gap:2px;
    background: var(--paper);
    border:1px solid var(--line);
    border-radius: 3px;
    padding: 3px;
    margin-bottom: 18px;
  }
  .mode-toggle button{
    flex:1; padding: 8px 10px; border:none; background:transparent;
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:0.06em;
    text-transform:uppercase; font-weight:700; color: var(--ink-soft);
    border-radius: 2px; cursor:pointer;
  }
  .mode-toggle button.active{ background: var(--ink); color: var(--paper); }

  .dial-zone{ display:flex; align-items:center; justify-content:center; padding: 8px 0 4px; }
  .dial{
    position:relative; width:184px; height:184px; border-radius:50%;
    background:
      radial-gradient(circle at center, var(--paper) 0 58%, transparent 58.5%),
      conic-gradient(var(--brass) 0deg, var(--line) 0deg);
    display:flex; align-items:center; justify-content:center;
    border: 1px solid var(--line);
  }
  .dial-inner{ text-align:center; }
  .dial-value{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size: 30px; color: var(--ink);
  }
  .dial-unit{
    font-family:'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--ink-soft); margin-top:2px;
  }
  input[type=range]{
    width: 100%; margin-top: 16px; accent-color: var(--blaze);
  }
  .range-labels{ display:flex; justify-content:space-between; font-family:'JetBrains Mono', monospace; font-size:10.5px; color: var(--ink-soft); margin-top:4px; }

  .btn-primary{
    width:100%; padding: 14px; margin-top: 18px;
    background: var(--blaze); color: var(--paper);
    border:none; border-radius: 3px;
    font-family:'Public Sans', sans-serif; font-weight:700; font-size:14.5px;
    cursor:pointer; letter-spacing:0.01em;
    transition: background 0.15s ease;
  }
  .btn-primary:hover{ background: var(--blaze-dark); }
  .btn-primary:disabled
